<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .action-button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }
        .action-button:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <h1>Проверки</h1>
    <button onclick="window.location.href='/users'">Пользователи</button>
    <button onclick="window.location.href='/checklists'">Чек-листы</button>
</body>

<body>
    <div class="container">
        <h1>Создать Проверку</h1>
        <form action="/add_inspection" method="post">
            <div class="form-group">
                <label for="checklist_id">Чек-лист</label>
                <select id="checklist_id" name="checklist_id" required>
                    {% for checklist in checklists %}
                        <option value="{{ checklist._id }}">{{ checklist.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="user_id">Пользователь</label>
                <select id="user_id" name="user_id" required>
                    {% for user in users %}
                        <option value="{{ user._id }}">{{ user.fio }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="object_name">Объект</label>
                <input type="text" id="object_name" name="object_name" required>
            </div>
            <div class="form-group">
                <label for="inspection_date">Дата</label>
                <input type="date" id="inspection_date" name="inspection_date" required>
            </div>
            <button type="submit">Создать Проверку</button>
        </form>
    </div>
    <div class="container">
        <h2>Назначенные Проверки</h2>
        <table>
            <thead>
                <tr>
                    <th>Чек-лист</th>
                    <th>Пользователь</th>
                    <th>Объект</th>
                    <th>Дата</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for inspection in inspections %}
                <tr>
                    <td>{{ inspection.checklist_name }}</td>
                    <td>{{ inspection.user_name }}</td>
                    <td>{{ inspection.object_name }}</td>
                    <td>{{ inspection.inspection_date }}</td>
                    <td>
                        <form action="/delete_inspection/{{ inspection._id }}" method="post" style="display:inline;">
                            <button type="submit" class="action-button">Удалить</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
</html>
